[tool.poetry]
name = "crosshair"
version = "0.0.1"
description = "Simple crosshair overlay (MVP)"
authors = ["Afanasy Alekseev <retjarhan123@gmail.com>"]
package-mode = false
#packages = [{ include = "crosshair_mvp", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
PySide6 = ">=6.8.0"

[tool.poetry.group.dev.dependencies]
black = "^24.8.0"
isort = "^5.13.2"
flake8 = "^7.1.1"
flake8-pyproject = "^1.2.3"

#[tool.poetry.scripts]
#crosshair = "crosshair_mvp.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
#known_first_party = ["crosshair_mvp"]
src_paths = ["src"]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", ".venv", "dist", "build"]